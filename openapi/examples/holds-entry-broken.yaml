# Lab 1: a first draft of the POST /v1/holds entry with three mistakes for lintContract to find.
openapi: 3.1.2
info:
  title: SeatWave holds (Lab 1, first draft)
  version: 1.0.0
paths:
  /v1/holds:
    post:
      operationId: holdSeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, seat, customer]
              properties:
                eventId:
                  type: integer
                seat:
                  type: string
      responses:
        '201':
          description: Held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '409':
          description: Seat taken.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas: {}
